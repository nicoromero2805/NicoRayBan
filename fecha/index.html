<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#dff2ea" />
<title>Reserva la Fecha</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Water+Brush&display=swap" rel="stylesheet">

<style>
:root {
  --mint:#71c7a9;
  --mint-soft:#b8e0d2;
  --pink:#ff7394;
  --paper:#fffdf9;
  --ink:#64706c;
  --bg:#dff2ea;
  --shadow:rgba(55,99,84,.18);
}

* { box-sizing:border-box; }

html, body {
  margin:0;
  min-height:100%;
}

body {
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:
    max(14px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(18px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
  background:
    radial-gradient(circle at 50% 12%, rgba(255,255,255,.95) 0 18%, transparent 42%),
    linear-gradient(180deg, #e8f7f1 0%, #d8eee6 100%);
  font-family:"Montserrat",system-ui,sans-serif;
  color:var(--ink);
  overflow-x:hidden;
}

.bg-line {
  position:fixed;
  left:0; right:0;
  top:44%;
  height:120px;
  opacity:.55;
  pointer-events:none;
}

.bg-line::before {
  content:"";
  position:absolute;
  inset:45% 0 auto 0;
  border-top:3px solid rgba(113,199,169,.42);
  transform:skewY(-2deg);
}

.wrap {
  width:min(96vw,980px);
  text-align:center;
}

.scene {
  perspective:1800px;
  width:100%;
}

.card {
  position:relative;
  width:100%;
  aspect-ratio: 1.72 / 1;
  margin:auto;
  transform-style:preserve-3d;
  border-radius:24px;
  filter:drop-shadow(0 24px 32px var(--shadow));
}

.paper {
  position:absolute;
  inset:0;
  border-radius:24px;
  overflow:hidden;
  background:
    radial-gradient(circle at 10% 15%, rgba(160,160,160,.035) 0 1px, transparent 1.5px),
    radial-gradient(circle at 70% 70%, rgba(160,160,160,.03) 0 1px, transparent 1.5px),
    var(--paper);
  background-size:18px 18px, 24px 24px, auto;
  border:1px solid rgba(90,130,117,.09);
}

.cover {
  z-index:3;
  transform-origin:top center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  transition:
    transform .95s cubic-bezier(.18,.78,.14,1),
    opacity .2s linear .7s;
}

.inside {
  z-index:1;
  opacity:0;
  transform:scale(.97);
  transition:
    opacity .38s ease .42s,
    transform .52s ease .35s;
}

.card.open .cover {
  transform:rotateX(105deg) translateY(-2%);
  opacity:0;
  pointer-events:none;
}

.card.open .inside {
  opacity:1;
  transform:scale(1);
}

.script {
  font-family:"Water Brush","Brush Script MT",cursive;
  color:var(--mint);
  font-weight:400;
  line-height:.86;
}

.date {
  font-size:clamp(13px,1.7vw,24px);
  letter-spacing:.38em;
  font-weight:300;
  color:#6d7472;
}

.cover-title-1 {
  position:absolute;
  left:18%;
  top:8%;
  font-size:clamp(62px,12.6vw,174px);
  white-space:nowrap;
  transform:rotate(-2deg);
}

.cover-title-2 {
  position:absolute;
  left:31%;
  top:41%;
  font-size:clamp(64px,12.6vw,174px);
  white-space:nowrap;
  transform:rotate(-2deg);
}

.cover .date {
  position:absolute;
  left:50%;
  bottom:14%;
  transform:translateX(-50%);
}

.cover .open-label {
  position:absolute;
  left:50%;
  bottom:6.5%;
  transform:translateX(-50%);
  font-size:clamp(9px,1.05vw,14px);
  letter-spacing:.34em;
  white-space:nowrap;
  color:#6b7672;
}

.heart {
  position:absolute;
  width:58px;
  aspect-ratio:1;
  background:var(--pink);
  transform:rotate(-45deg);
}

.heart::before,
.heart::after {
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  border-radius:50%;
  background:inherit;
}

.heart::before { top:-50%; left:0; }
.heart::after { top:0; left:50%; }

.cover .h1 { width:4.5%; right:22%; top:14%; }
.cover .h2 { width:7.4%; right:10%; top:22%; }

/* Interior */
.inside-grid {
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:1fr .78fr 1fr;
  align-items:center;
  gap:2%;
  padding:5% 4.5%;
}

.left-copy {
  text-align:center;
  align-self:center;
}

.left-copy .big {
  font-size:clamp(45px,8.5vw,116px);
  transform:rotate(-2deg);
}

.left-copy .small-heart {
  margin-top:8%;
  font-size:clamp(28px,4vw,52px);
  color:var(--mint);
}

.ultra-wrap {
  position:relative;
  align-self:center;
  justify-self:center;
  width:min(100%,290px);
  transform:rotate(-5deg);
}

.tape {
  position:absolute;
  width:45%;
  height:12%;
  left:28%;
  top:-7%;
  background:rgba(113,199,169,.62);
  transform:rotate(-4deg);
  z-index:3;
  box-shadow:0 2px 4px rgba(0,0,0,.04);
}

.tape::after {
  content:"♡";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:white;
  font-size:clamp(14px,2vw,22px);
}

.polaroid {
  background:white;
  padding:6% 6% 10%;
  box-shadow:0 10px 24px rgba(0,0,0,.18);
}

.polaroid img {
  display:block;
  width:100%;
  aspect-ratio:1.18/1;
  object-fit:cover;
  filter:grayscale(1) contrast(1.05);
}

.right-copy {
  text-align:center;
  align-self:center;
}

.right-copy .big {
  font-size:clamp(42px,7.2vw,96px);
  line-height:.92;
}

.right-copy .big span {
  display:block;
}

.right-copy .ornament {
  margin:3% auto 0;
  font-size:clamp(24px,3.2vw,42px);
  color:var(--mint);
}

.right-copy .date {
  margin-top:5%;
  font-size:clamp(10px,1.45vw,19px);
}

.inside .ih1 { width:3.6%; right:14.2%; top:12%; }
.inside .ih2 { width:6.1%; right:6%; top:20%; }

.tap {
  position:absolute;
  inset:0;
  z-index:6;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
  border-radius:24px;
  -webkit-tap-highlight-color:transparent;
}

.tap:focus-visible {
  outline:3px solid rgba(113,199,169,.75);
  outline-offset:6px;
}

.footer {
  margin-top:14px;
  font-size:clamp(11px,1.5vw,14px);
  letter-spacing:.03em;
  opacity:.58;
  min-height:18px;
}

@media (max-width:720px) {
  .wrap {
    width:100%;
  }

  .card {
    aspect-ratio:1.36 / 1;
    border-radius:18px;
  }

  .paper {
    border-radius:18px;
  }

  .cover-title-1 {
    left:10%;
    top:8%;
    font-size:20vw;
  }

  .cover-title-2 {
    left:23%;
    top:40%;
    font-size:20vw;
  }

  .cover .date {
    bottom:14%;
    font-size:3vw;
  }

  .cover .open-label {
    bottom:6%;
    font-size:1.65vw;
  }

  .inside-grid {
    grid-template-columns:1fr;
    grid-template-rows:auto auto auto;
    gap:1.2rem;
    padding:7% 7%;
    overflow:auto;
  }

  .left-copy .big {
    font-size:13vw;
  }

  .ultra-wrap {
    width:min(56vw,250px);
  }

  .right-copy .big {
    font-size:11vw;
  }

  .inside .ih1,
  .inside .ih2 {
    display:none;
  }
}

@media (max-width:460px) {
  body {
    align-items:start;
    padding-top:18px;
  }

  .card.open {
    aspect-ratio:auto;
    min-height:760px;
  }

  .card.open .paper.inside {
    position:relative;
    min-height:760px;
  }

  .footer {
    margin-bottom:8px;
  }
}

@media (prefers-reduced-motion:reduce) {
  .cover,.inside { transition:none!important; }
}
</style>
</head>

  tap.setAttribute("aria-pressed", String(open));
  tap.setAttribute("aria-label", open ? "Cerrar invitación" : "Abrir invitación");

});
