<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef8f4">

  <!-- Neutro para no arruinar la sorpresa al compartir el link -->
  <title>Reserva la fecha</title>
  <meta name="description" content="Tenemos algo importante para compartir con vos ❤️">
  <meta property="og:title" content="Reserva la Fecha">
  <meta property="og:description" content="Tenemos algo importante para compartir con vos ❤️">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Water+Brush&display=swap" rel="stylesheet">

  <style>
    :root {
      --mint:#82cdb3;
      --mint-dark:#58af90;
      --mint-pale:#eaf6f1;
      --pink:#ff7898;
      --pink-soft:#ffd7e0;
      --cream:#fffdf8;
      --ink:#5e6763;
      --shadow:rgba(57,94,81,.18);
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    html,body { margin:0; min-height:100%; }

    body {
      min-height:100dvh;
      font-family:"Montserrat",system-ui,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 18% 10%, rgba(255,255,255,.95), transparent 26%),
        radial-gradient(circle at 82% 18%, rgba(255,230,237,.65), transparent 22%),
        linear-gradient(160deg,#f8fcfa 0%,#edf7f3 46%,#e3f1eb 100%);
      overflow-x:hidden;
    }

    .ambient {
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .blob {
      position:absolute;
      border-radius:50%;
      filter:blur(3px);
      opacity:.45;
    }

    .blob.one {
      width:340px;height:340px;
      background:#dff2ea;
      left:-90px;top:18%;
    }

    .blob.two {
      width:290px;height:290px;
      background:#ffe5eb;
      right:-100px;bottom:10%;
    }

    .doodle {
      position:absolute;
      color:rgba(95,178,149,.22);
      font-size:clamp(28px,4vw,56px);
      animation:floaty 7s ease-in-out infinite;
    }

    .d1 { left:7%;top:12%; }
    .d2 { right:8%;top:22%; animation-delay:-2s; }
    .d3 { left:11%;bottom:14%; animation-delay:-4s; }
    .d4 { right:12%;bottom:8%; animation-delay:-1s; }

    @keyframes floaty {
      0%,100% { transform:translateY(0) rotate(-5deg); }
      50% { transform:translateY(-12px) rotate(4deg); }
    }

    .page {
      position:relative;
      z-index:1;
      width:min(1120px,100%);
      margin:auto;
      padding:
        max(26px,env(safe-area-inset-top))
        max(14px,env(safe-area-inset-right))
        max(28px,env(safe-area-inset-bottom))
        max(14px,env(safe-area-inset-left));
      min-height:100dvh;
      display:grid;
      place-items:center;
    }

    .eyebrow {
      text-align:center;
      font-size:clamp(10px,1.1vw,13px);
      text-transform:uppercase;
      letter-spacing:.32em;
      margin-bottom:16px;
      color:#7b8a84;
      opacity:.76;
    }

    .scene {
      width:min(100%,980px);
      perspective:1800px;
    }

    .invite {
      position:relative;
      width:100%;
      aspect-ratio:1.75 / 1;
      transform-style:preserve-3d;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    .paper {
      position:absolute;
      inset:0;
      border-radius:30px;
      overflow:hidden;
      border:1px solid rgba(90,145,125,.12);
      background:
        radial-gradient(circle at 10% 15%, rgba(110,110,110,.035) 0 1px, transparent 1.5px),
        radial-gradient(circle at 70% 70%, rgba(110,110,110,.025) 0 1px, transparent 1.5px),
        var(--cream);
      background-size:18px 18px,23px 23px,auto;
      box-shadow:0 24px 70px var(--shadow);
      backface-visibility:hidden;
    }

    .cover {
      z-index:3;
      transform-origin:top center;
      transform-style:preserve-3d;
      transition:
        transform 1.55s cubic-bezier(.18,.76,.12,1),
        opacity .35s ease 1.12s;
    }

    .inside {
      z-index:1;
      opacity:0;
      transform:translateY(8px) scale(.97);
      transition:
        opacity .75s ease .95s,
        transform .95s cubic-bezier(.2,.74,.2,1) .82s;
    }

    .invite.open .cover {
      transform:rotateX(105deg) translateY(-2%);
      opacity:0;
      pointer-events:none;
    }

    .invite.open .inside {
      opacity:1;
      transform:translateY(0) scale(1);
    }

    .script {
      font-family:"Water Brush","Brush Script MT",cursive;
      font-weight:400;
      color:var(--mint);
      line-height:.86;
    }

    .cover-copy {
      position:absolute;
      inset:0;
    }

    .cover-title1 {
      position:absolute;
      left:14%;
      top:8%;
      font-size:clamp(68px,12.7vw,178px);
      transform:rotate(-2deg);
      white-space:nowrap;
    }

    .cover-title2 {
      position:absolute;
      left:29%;
      top:43%;
      font-size:clamp(68px,12.7vw,178px);
      transform:rotate(-1.5deg);
      white-space:nowrap;
    }

    .date {
      font-size:clamp(12px,1.7vw,24px);
      letter-spacing:.34em;
      font-weight:300;
      white-space:nowrap;
    }

    .cover .date {
      position:absolute;
      left:50%;
      bottom:13%;
      transform:translateX(-50%);
    }

    .tap-note {
      position:absolute;
      left:50%;
      bottom:5%;
      transform:translateX(-50%);
      font-size:clamp(8px,.95vw,12px);
      letter-spacing:.28em;
      white-space:nowrap;
      color:#7a8782;
    }

    .heart {
      position:absolute;
      width:58px;
      aspect-ratio:1;
      background:var(--pink);
      transform:rotate(-45deg);
    }
    .heart::before,.heart::after {
      content:"";
      position:absolute;
      width:100%;height:100%;
      border-radius:50%;
      background:inherit;
    }
    .heart::before { top:-50%;left:0; }
    .heart::after { left:50%;top:0; }

    .cover .h1 { width:4.4%;right:22%;top:15%; }
    .cover .h2 { width:7.2%;right:10%;top:22%; }

    .inside-grid {
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:1fr .82fr 1fr;
      gap:3%;
      align-items:center;
      padding:5.5% 5%;
    }

    .left,.right { text-align:center; }

    .left .headline {
      font-size:clamp(46px,8.3vw,115px);
      transform:rotate(-2deg);
    }

    .right .headline {
      font-size:clamp(40px,7vw,98px);
      transform:rotate(-1deg);
    }

    .right .headline span { display:block; }

    .mini-line {
      margin:6% auto 0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:var(--mint);
      font-size:clamp(18px,2.3vw,32px);
    }

    .mini-line::before,.mini-line::after {
      content:"";
      width:42px;
      height:1px;
      background:rgba(88,175,144,.55);
    }

    .right .date {
      margin-top:6%;
      font-size:clamp(10px,1.45vw,19px);
    }

    .photo-wrap {
      position:relative;
      justify-self:center;
      width:min(100%,300px);
      transform:rotate(-4.5deg);
      transition:transform .35s ease;
    }

    .invite.open .photo-wrap:hover {
      transform:rotate(-1deg) scale(1.025);
    }

    .tape {
      position:absolute;
      z-index:3;
      width:46%;
      height:13%;
      top:-6%;
      left:27%;
      background:rgba(130,205,179,.66);
      transform:rotate(-4deg);
      box-shadow:0 2px 5px rgba(0,0,0,.05);
    }

    .tape::after {
      content:"♡";
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:white;
      font-size:clamp(14px,2vw,23px);
    }

    .polaroid {
      background:#fff;
      padding:6% 6% 13%;
      box-shadow:0 12px 28px rgba(25,45,38,.20);
      border-radius:3px;
    }

    .polaroid img {
      width:100%;
      aspect-ratio:1.18/1;
      object-fit:cover;
      display:block;
      filter:grayscale(1) contrast(1.06);
    }

    .caption {
      margin-top:8%;
      font-size:clamp(8px,.9vw,11px);
      letter-spacing:.13em;
      color:#9aa29f;
      text-transform:uppercase;
    }

    .inside .ih1 { width:3.6%;right:13%;top:12%; }
    .inside .ih2 { width:6%;right:5.4%;top:20%; }

    .click-layer {
      position:absolute;
      inset:0;
      z-index:6;
      border:0;
      padding:0;
      background:transparent;
      cursor:pointer;
      border-radius:30px;
    }

    .click-layer:focus-visible {
      outline:3px solid rgba(88,175,144,.78);
      outline-offset:7px;
    }

    .footer {
      margin-top:16px;
      text-align:center;
      font-size:clamp(11px,1.4vw,14px);
      opacity:.56;
    }

    @media(max-width:760px) {
      .page { place-items:start center; padding-top:18px; }

      .invite {
        aspect-ratio:1.34/1;
      }

      .paper { border-radius:20px; }
      .click-layer { border-radius:20px; }

      .cover-title1 {
        left:10%;
        top:8%;
        font-size:20vw;
      }

      .cover-title2 {
        left:23%;
        top:41%;
        font-size:20vw;
      }

      .cover .date {
        font-size:3vw;
        bottom:13%;
      }

      .tap-note {
        font-size:1.7vw;
        bottom:5.5%;
      }

      .inside-grid {
        grid-template-columns:1fr;
        grid-template-rows:auto auto auto;
        gap:1.1rem;
        padding:7% 7%;
        overflow:auto;
      }

      .left .headline { font-size:13vw; }
      .right .headline { font-size:11.2vw; }

      .photo-wrap {
        width:min(58vw,260px);
      }

      .inside .ih1,.inside .ih2 { display:none; }

      .invite.open {
        aspect-ratio:auto;
        min-height:760px;
      }

      .invite.open .inside {
        position:relative;
        min-height:760px;
      }
    }

    @media(max-width:420px) {
      .page {
        padding-left:8px;
        padding-right:8px;
      }
      .invite.open { min-height:720px; }
      .invite.open .inside { min-height:720px; }
    }



    /* Cuenta regresiva antes de abrir */
    .countdown {
      position:fixed;
      inset:0;
      z-index:80;
      display:grid;
      place-items:center;
      pointer-events:none;
      opacity:0;
      visibility:hidden;
      background:rgba(238,248,244,.18);
      backdrop-filter:blur(2px);
      transition:opacity .25s ease;
    }

    .countdown.show {
      opacity:1;
      visibility:visible;
    }

    .countdown-number {
      font-family:"Water Brush","Brush Script MT",cursive;
      color:var(--mint-dark);
      font-size:clamp(100px,19vw,220px);
      line-height:1;
      text-shadow:0 10px 30px rgba(57,94,81,.12);
      animation:count-pop .72s cubic-bezier(.18,.76,.12,1);
    }

    @keyframes count-pop {
      0%   { opacity:0; transform:scale(.58); }
      28%  { opacity:1; transform:scale(1.08); }
      72%  { opacity:1; transform:scale(1); }
      100% { opacity:0; transform:scale(1.22); }
    }

    /* Papelitos sutiles al abrir */
    .confetti-piece {
      position: fixed;
      z-index: 50;
      width: 7px;
      height: 11px;
      border-radius: 2px;
      pointer-events: none;
      opacity: 0;
      animation: paper-pop 1.65s ease-out forwards;
    }

    @keyframes paper-pop {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(0deg) scale(.65);
      }
      12% { opacity: .82; }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1);
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .cover,.inside,.doodle,.photo-wrap { transition:none!important; animation:none!important; }
    }
  </style>
</head>

  </div>

<script>
  const invite = document.getElementById('invite');
  const clickLayer = document.getElementById('clickLayer');
  const footer = document.getElementById('footer');

  function throwPapelitos() {
    const colors = ['#ff7898', '#82cdb3', '#ffd6df', '#c9eadf', '#f5d78e'];
    const total = window.innerWidth < 600 ? 24 : 36;

    for (let i = 0; i < total; i++) {
      const p = document.createElement('span');
      p.className = 'confetti-piece';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = (50 + (Math.random() * 16 - 8)) + 'vw';
      p.style.top = (43 + (Math.random() * 8 - 4)) + 'vh';
      p.style.setProperty('--dx', (Math.random() * 440 - 220) + 'px');
      p.style.setProperty('--dy', (Math.random() * 300 + 100) + 'px');
      p.style.setProperty('--rot', (Math.random() * 700 - 350) + 'deg');
      p.style.animationDelay = (Math.random() * .10) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1900);
    }
  }

  function setOpen(open) {
    invite.classList.toggle('open', open);
    clickLayer.setAttribute('aria-pressed', String(open));
    clickLayer.setAttribute('aria-label', open ? 'Cerrar invitación' : 'Abrir invitación');
    footer.textContent = open
      ? 'Tocá nuevamente para volver a la portada'
      : 'Tocá la tarjeta para abrirla 💌';

    if (open) {
      setTimeout(throwPapelitos, 1250);
    }

    if (open && window.innerWidth < 760) {
      setTimeout(() => invite.scrollIntoView({behavior:'smooth', block:'start'}), 380);
    }
  }

  const countdown = document.getElementById('countdown');
  const countdownNumber = document.getElementById('countdownNumber');
  let counting = false;

  function animateNumber(value) {
    countdownNumber.textContent = value;
    countdownNumber.style.animation = 'none';
    void countdownNumber.offsetWidth;
    countdownNumber.style.animation = 'count-pop .72s cubic-bezier(.18,.76,.12,1)';
  }

  function startCountdown() {
    if (counting) return;
    counting = true;
    countdown.classList.add('show');

    animateNumber('3');

    setTimeout(() => animateNumber('2'), 850);
    setTimeout(() => animateNumber('1'), 1700);

    setTimeout(() => {
      countdown.classList.remove('show');
      setOpen(true);
      counting = false;
    }, 2550);
  }

  clickLayer.addEventListener('click', () => {
    if (invite.classList.contains('open')) {
      setOpen(false);
      return;
    }
    startCountdown();
  });
</script>
